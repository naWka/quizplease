<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проверка клипов</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 24px 16px; background: #0e0c18; color: #f5f2ff; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  p { color: #a8a1cb; margin: 0 0 16px; }
  /* плеер должен быть на экране (иначе браузер не запустит видео), но кадры и название
     закрыты непрозрачной плашкой — проверка не должна спойлерить клипы */
  #player { position: fixed; right: 16px; bottom: 16px; width: 160px; height: 90px; pointer-events: none; }
  #player::after { content: ''; position: absolute; inset: 0; background: #0e0c18; z-index: 1; }
  ol { padding-left: 1.4em; }
  li { padding: 2px 0; font-variant-numeric: tabular-nums; }
  .ok { color: #2ee6b6; } .bad { color: #ff5d73; font-weight: 700; } .wait { color: #a8a1cb; }
  #summary { font-weight: 700; margin: 16px 0; }
</style>
</head>
<body>
<main>
  <h1>Проверка клипов</h1>
  <p>Без спойлеров: только пак, раунд и номер вопроса. Звук выключен. Займёт около минуты.</p>
  <div id="env"></div>
  <div id="summary">Загружаю…</div>
  <ol id="list"></ol>
</main>
<div id="player"></div>
<script>
  const REASONS = { 2: 'неверный ID', 5: 'ошибка плеера', 100: 'видео удалено', 101: 'встраивание запрещено', 150: 'встраивание запрещено (или недоступно в вашем регионе)', 153: 'страница открыта не через сервер' };
  const env = document.getElementById('env');
  const list = document.getElementById('list');
  const summary = document.getElementById('summary');
  const clips = [];
  let rows = [];

  // паки берём из index.html — чтобы новый пак не надо было прописывать ещё и здесь
  async function loadPacks() {
    const html = await fetch('index.html', { cache: 'no-store' }).then(r => r.text());
    const srcs = [...html.matchAll(/<script\s+src="(packs\/[^"]+\.js)"/g)].map(m => m[1]);
    for (const src of srcs) {
      await new Promise(res => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = res;
        s.onerror = () => { env.innerHTML += `<p class="bad">Не загрузился ${src}</p>`; res(); };
        document.head.appendChild(s);
      });
    }
  }

  function buildList() {
    (window.QUIZ_PACKS || []).forEach(p => p.rounds.forEach((r, ri) => r.questions.forEach((q, qi) => {
      const label = `«${p.title}» — раунд ${ri + 1}, вопрос ${qi + 1}`;
      // без end движок играет 15 секунд от start — проверяем то же самое
      const m = q.yt || q.file;
      if (m) clips.push({ label, kind: q.yt ? 'yt' : 'file', ...m, start: m.start || 0, end: m.end || (m.start || 0) + 15 });
    })));
    rows = clips.map(c => {
      const li = document.createElement('li');
      const status = document.createElement('span');
      status.className = 'wait';
      status.textContent = 'ждёт';
      li.append(`${c.label}: `, status);
      list.appendChild(li);
      return status;
    });
  }

  // таймкоды проверяем до загрузки видео
  function badWindow(c) {
    return c.end > c.start ? '' : `конец фрагмента (${c.end} с) не позже начала (${c.start} с)`;
  }

  function checkYT(c) {
    return new Promise(res => {
      if (badWindow(c)) return res({ ok: false, text: badWindow(c) });
      document.getElementById('player').innerHTML = '<div id="pp"></div>';
      let done = false, player;
      const finish = (ok, text) => { if (done) return; done = true; try { player.destroy(); } catch (e) {} res({ ok, text }); };
      player = new YT.Player('pp', {
        videoId: c.id, width: 160, height: 90,
        playerVars: { start: Math.floor(c.start || 0), controls: 0, mute: 1, playsinline: 1, origin: location.origin },
        events: {
          onReady: e => { e.target.mute(); e.target.playVideo(); },
          onStateChange: e => {
            if (e.data !== 1) return;
            setTimeout(() => {
              const dur = player.getDuration ? player.getDuration() : 0;
              if (dur && c.start >= dur) finish(false, `начало фрагмента (${c.start} с) за концом видео (${Math.floor(dur)} с)`);
              else if (dur && c.end > dur + 0.5) finish(false, `фрагмент кончается на ${c.end} с, а видео длится ${Math.floor(dur)} с`);
              else finish(true, 'играет');
            }, 800);
          },
          onError: e => finish(false, `ошибка ${e.data}: ${REASONS[e.data] || 'неизвестно'}`),
        },
      });
      setTimeout(() => finish(false, 'не стартовал за 15 сек (медленный интернет/VPN или браузер блокирует автозапуск)'), 15000);
    });
  }

  function checkFile(c) {
    return new Promise(res => {
      if (badWindow(c)) return res({ ok: false, text: badWindow(c) });
      const m = document.createElement('video');
      const finish = (ok, text) => { m.removeAttribute('src'); m.load(); res({ ok, text }); };
      m.preload = 'metadata';
      m.onloadedmetadata = () => (c.end && c.end > m.duration + 0.5
        ? finish(false, `фрагмент кончается на ${c.end} с, а файл длится ${Math.floor(m.duration)} с`)
        : finish(true, 'файл на месте'));
      m.onerror = () => finish(false, 'файл не найден или формат не поддерживается');
      m.src = c.src;
    });
  }

  async function run() {
    let bad = 0;
    for (let i = 0; i < clips.length; i++) {
      summary.textContent = `Проверяю ${i + 1} из ${clips.length}…`;
      rows[i].className = 'wait'; rows[i].textContent = 'проверяю…';
      const r = await (clips[i].kind === 'yt' ? checkYT(clips[i]) : checkFile(clips[i]));
      rows[i].className = r.ok ? 'ok' : 'bad';
      rows[i].textContent = r.text;
      if (!r.ok) bad++;
    }
    summary.innerHTML = bad ? `<span class="bad">Не играют: ${bad} из ${clips.length}</span>` : `<span class="ok">Все ${clips.length} клипов играют</span>`;
  }

  (async () => {
    if (location.protocol === 'file:') {
      env.innerHTML = '<p class="bad">Страница открыта как файл — так YouTube не работает. Запустите start.command.</p>';
      summary.textContent = '';
      return;
    }
    await loadPacks();
    buildList();
    if (!clips.length) { summary.textContent = 'В паках нет фрагментов.'; return; }
    if (!clips.some(c => c.kind === 'yt')) return run();
    window.onYouTubeIframeAPIReady = run;
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
    setTimeout(() => { if (!window.YT || !YT.Player) summary.innerHTML = '<span class="bad">YouTube не загрузился: нет интернета, нужен VPN или его блокирует расширение/настройки приватности браузера.</span>'; }, 15000);
  })().catch(err => { summary.innerHTML = `<span class="bad">Не получилось загрузить паки: ${err.message}</span>`; });
</script>
</body>
</html>
